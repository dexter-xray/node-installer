<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08060d" />
  <title>API доступно</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #faf7ff;
      --muted: rgba(238, 228, 255, .68);
      --line: rgba(255, 255, 255, .13);
      --purple: #f97316;
      --accent: #f97316;
      --accent-mid: #c2410c;
      --accent-deep: #7c2d12;
      --bg-end: #210b03;
      --bg-mid: #1c0c06;
      --heading-soft: #ffedd5;
      --heading-accent: #fb923c;
      --green: #62e6aa;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 17% 18%, color-mix(in srgb, var(--accent-mid) 48%, transparent), transparent 35%),
        radial-gradient(circle at 83% 82%, color-mix(in srgb, var(--accent-deep) 48%, transparent), transparent 38%),
        linear-gradient(145deg, #030305 0%, var(--bg-mid) 52%, var(--bg-end) 100%);
    }
    .glow, .glow::before {
      position: fixed;
      border-radius: 50%;
      filter: blur(78px);
      pointer-events: none;
    }
    .glow {
      width: 320px;
      height: 320px;
      top: -140px;
      right: 8%;
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      animation: drift 9s ease-in-out infinite alternate;
    }
    .glow::before {
      content: "";
      width: 220px;
      height: 220px;
      left: -72vw;
      top: 65vh;
      background: rgba(98, 230, 170, .08);
    }
    .grid {
      position: fixed;
      inset: 0;
      opacity: .3;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 75%, transparent);
    }
    main {
      position: relative;
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(21, 15, 29, .84), rgba(8, 7, 11, .72));
      box-shadow: 0 32px 90px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255,255,255,.07);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 8px 14px;
      border: 1px solid rgba(98, 230, 170, .26);
      border-radius: 999px;
      color: #a9f4cf;
      background: rgba(35, 163, 103, .1);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(98,230,170,.1), 0 0 22px rgba(98,230,170,.85);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .icon {
      width: 82px;
      height: 82px;
      margin: 28px auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(98,230,170,.13), color-mix(in srgb, var(--accent-mid) 12%, transparent));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 16px 40px color-mix(in srgb, var(--accent-deep) 30%, transparent);
      transform: rotate(-3deg);
    }
    .icon svg { width: 40px; height: 40px; transform: rotate(3deg); }
    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 70px);
      line-height: 1.02;
      letter-spacing: -.055em;
      background: linear-gradient(110deg, #ffffff 10%, var(--heading-soft) 54%, var(--heading-accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      max-width: 520px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 18px);
      line-height: 1.6;
    }
    .endpoint {
      width: min(430px, 100%);
      min-height: 54px;
      margin: 30px auto 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      text-align: left;
      background: rgba(255,255,255,.035);
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .method { color: var(--green); font-weight: 800; }
    .path { min-width: 0; overflow: hidden; color: #e8dcf7; text-overflow: ellipsis; white-space: nowrap; }
    .code {
      margin-left: auto;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,.1);
      color: var(--green);
      font-weight: 700;
    }
    footer {
      margin-top: 24px;
      color: rgba(238, 228, 255, .43);
      font-size: 14px;
    }
    @keyframes pulse {
      0%, 100% { opacity: .68; transform: scale(.9); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes drift { to { transform: translate(-35px, 45px) scale(1.08); } }
    @media (max-width: 520px) {
      body { padding: 16px; }
      main { padding: 36px 22px; border-radius: 18px; }
      .icon { width: 72px; height: 72px; margin-top: 24px; }
      p { margin-top: 18px; }
      .endpoint { margin-top: 25px; padding: 12px; gap: 9px; font-size: 12px; }
      .code { padding-left: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body data-theme="07-coral">
  <div class="glow" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <main>
    <div class="status"><span class="dot" aria-hidden="true"></span> Все системы работают</div>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="m7 12.5 3 3 7-7" stroke="url(#ok)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke="url(#ok)" stroke-width="1.7"/>
        <defs><linearGradient id="ok" x1="4" y1="4" x2="20" y2="20"><stop stop-color="#E9FFF5"/><stop offset="1" stop-color="#62E6AA"/></linearGradient></defs>
      </svg>
    </div>
    <h1>API доступно</h1>
    <p>Сервис работает в штатном режиме. Все API-методы доступны и готовы принимать запросы.</p>
    <div class="endpoint" aria-label="Состояние API">
      <span class="method">GET</span>
      <span class="path">/api/v1/status</span>
      <span class="code">200 OK</span>
    </div>
    <footer>Последняя проверка: только что</footer>
  </main>
</body>
</html>
